<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家人健康档案</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤</text></svg>">
<style>
:root{
  --bg:#f4f7f6;--card:#fff;--ink:#1f2d3d;--ink2:#5a6b7d;--ink3:#94a3b8;
  --line:#e6edf0;--brand:#0d9488;--brand2:#14b8a6;--brand-soft:#e6f7f5;
  --shadow:0 1px 3px rgba(15,40,50,.06),0 4px 16px rgba(15,40,50,.05);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:8px;border-radius:8px;color:var(--ink);transition:.15s}
.hamburger:hover{background:var(--bg)}
.hamburger svg{width:22px;height:22px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;backdrop-filter:blur(2px)}
.sidebar-overlay.show{display:block}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff}
.brand .logo svg{width:20px;height:20px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:500;transition:.15s;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:#0f766e}
.btn-outline{border-color:var(--line);background:#fff;color:var(--ink2)}
.btn-outline:hover{border-color:var(--brand);color:var(--brand)}
.btn-danger{background:#fef2f2;color:#ef4444}
.btn-danger:hover{background:#fee2e2}
.btn svg{width:15px;height:15px}

/* 布局 */
.layout{display:grid;grid-template-columns:240px 1fr;gap:20px;padding:20px;max-width:1100px;margin:0 auto}
@media(max-width:760px){.layout{grid-template-columns:1fr;padding:14px}.sidebar{position:static}}

/* 成员侧栏 */
.sidebar{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;height:fit-content;position:sticky;top:76px}
.sidebar h3{font-size:13px;color:var(--ink3);font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.member-list{display:flex;flex-direction:column;gap:6px}
.member-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:.15s;border:1px solid transparent}
.member-item:hover{background:var(--bg)}
.member-item.active{background:var(--brand-soft);border-color:#b2e8e2}
.member-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;flex-shrink:0}
.member-info{flex:1;min-width:0}
.member-name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-meta{font-size:12px;color:var(--ink3)}
.member-del{opacity:0;color:var(--ink3);padding:4px;border-radius:6px;transition:.15s}
.member-item:hover .member-del{opacity:1}
.member-del:hover{color:#ef4444;background:#fef2f2}
.add-member{width:100%;margin-top:10px;padding:9px;border:1.5px dashed var(--line);border-radius:10px;color:var(--ink3);font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.add-member:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}

/* 档案卡 */
.profile-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.profile-header{padding:24px;display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,var(--brand-soft),#f0faf8);border-bottom:1px solid var(--line)}
.profile-avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:26px;flex-shrink:0;box-shadow:0 4px 12px rgba(13,148,136,.2)}
.profile-name{font-size:22px;font-weight:700;margin-bottom:2px}
.profile-sub{font-size:13.5px;color:var(--ink2)}
.profile-edit{margin-left:auto}

.section{padding:20px 24px;border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:none}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-title .icon{width:28px;height:28px;border-radius:8px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand)}
.section-title .icon svg{width:16px;height:16px}

.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.info-item label{display:block;font-size:12px;color:var(--ink3);margin-bottom:3px}
.info-item .val{font-size:14.5px;font-weight:500}
.info-item .val.empty{color:var(--ink3);font-style:italic;font-weight:400}

.habit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.habit-grid{grid-template-columns:1fr}}
.habit-item{background:var(--bg);border-radius:10px;padding:12px 14px}
.habit-item label{display:block;font-size:12px;color:var(--ink3);margin-bottom:4px}
.habit-item .val{font-size:14px;font-weight:500;line-height:1.5}
.habit-item .val.empty{color:var(--ink3);font-style:italic;font-weight:400}

.problems-text{font-size:14px;line-height:1.8;color:var(--ink2);white-space:pre-wrap}
.problems-text.empty{color:var(--ink3);font-style:italic}

/* 健康问题卡片 */
.problems-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.problem-card{background:var(--bg);border-radius:12px;padding:14px 16px;border:1px solid var(--line);transition:.15s;position:relative;cursor:pointer}
.problem-card:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(0,0,0,.06);transform:translateY(-1px)}
.problem-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.problem-title{font-weight:600;font-size:14.5px;color:var(--ink);flex:1}
.problem-actions{display:flex;gap:4px;flex-shrink:0}
.problem-action-btn{background:none;border:none;cursor:pointer;padding:5px;border-radius:6px;color:var(--ink3);transition:.15s}
.problem-action-btn:hover{background:#fff;color:var(--ink)}
.problem-action-btn.del:hover{color:#ef4444}
.problem-content{font-size:13.5px;color:var(--ink2);line-height:1.7;white-space:pre-wrap}
.problem-update{font-size:13px;color:var(--ink2);line-height:1.6;margin-top:8px;padding:8px 10px;background:#fff;border-radius:8px;border-left:3px solid var(--brand);white-space:pre-wrap}
.update-label{display:inline-block;font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:2px 6px;border-radius:4px;margin-right:6px;vertical-align:middle}
.problem-principle{font-size:12.5px;color:#b45309;background:#fef3c7;border-left:3px solid #f59e0b;padding:6px 10px;border-radius:6px;margin-top:8px;line-height:1.6}
.problem-principle::before{content:'原则：';font-weight:600;color:#92400e}

/* 跟踪更新编辑行 */
.update-row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.update-date{width:140px;flex-shrink:0;font-size:12px;color:var(--ink3);background:var(--bg);padding:8px 6px;border-radius:8px;text-align:center;font-weight:500;margin-top:2px;white-space:nowrap}
.update-row textarea{flex:1;min-height:70px;resize:vertical;font-size:14px;line-height:1.6}
.update-row .del-update{background:none;border:none;cursor:pointer;padding:6px;border-radius:6px;color:var(--ink3);flex-shrink:0;margin-top:4px}
.update-row .del-update:hover{color:#ef4444;background:var(--bg)}
.update-empty{color:var(--ink3);font-size:13px;font-style:italic;padding:8px 0}
.problem-date{font-size:11.5px;color:var(--ink3);margin-top:8px;display:flex;align-items:center;gap:4px}
.add-problem{width:100%;padding:12px;border:1.5px dashed var(--line);border-radius:12px;background:none;color:var(--ink3);font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:.15s}
.add-problem:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}

/* 病史时间线 */
.history-timeline{position:relative;padding-left:20px}
.history-timeline::before{desc:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.history-item{position:relative;padding-bottom:14px}
.history-item:last-child{padding-bottom:0}
.history-item::before{desc:'';position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 2px var(--brand-soft)}
.history-date{font-size:13px;font-weight:600;color:var(--ink)}
.history-place{font-size:11.5px;color:var(--ink3);margin-left:6px}
.history-event{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.6}
.history-empty{font-size:13px;color:var(--ink3);font-style:italic;padding:4px 0}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500}
.tag.warn{background:#fef3c7;color:#b45309}
.tag.danger{background:#fee2e2;color:#b91c1c}
.tag.ok{background:#dcfce7;color:#15803d}
.tag.info{background:#dbeafe;color:#1d4ed8}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink3);font-size:14px}
.empty-state svg{width:48px;height:48px;margin-bottom:12px;opacity:.4}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(15,30,40,.45);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff}
.modal-title{font-size:16px;font-weight:700}
.modal-close{color:var(--ink3);padding:4px;border-radius:6px}
.modal-close:hover{color:var(--ink);background:var(--bg)}
.modal-body{padding:24px 28px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:5px}
.form-group label .req{color:#ef4444}
.form-control{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;outline:none;transition:.15s;background:#fff;font-size:14px;line-height:1.6}
.form-control:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.form-control{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-hint{font-size:11.5px;color:var(--ink3);margin-top:3px}

.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:10px;font-size:13.5px;z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:760px){
  input,select,textarea{font-size:16px !important}
  .btn{min-height:40px}
  .section{padding:16px}
  .profile-header{padding:18px}
  .form-row{grid-template-columns:1fr;gap:0}
  .hamburger{display:block}
  .topbar{padding:10px 14px}
  .brand{font-size:15px}
  .layout{padding:14px}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:80vw;z-index:70;border-radius:0;transform:translateX(-100%);transition:transform .25s ease;box-shadow:4px 0 20px rgba(0,0,0,.15);overflow-y:auto}
  .sidebar.open{transform:translateX(0)}
  .modal-mask{padding:0;align-items:flex-start}
  .modal{max-width:100%;max-height:100vh;height:100vh;border-radius:0;display:flex;flex-direction:column}
  .modal-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:30px}
  textarea.form-control{min-height:100px}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="hamburger" onclick="toggleSidebar()" aria-label="菜单">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </div>
    家人健康档案
    <span id="syncStatus" style="font-size:11px;color:var(--ink3);margin-left:8px;font-weight:400"></span>
  </div>
  <button class="btn btn-outline" onclick="openTokenModal()" title="设置GitHub Token" style="margin-right:6px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    设置
  </button>
  <button class="btn btn-primary" onclick="openMemberModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    添加家人
  </button>
</header>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <h3>家人 <span id="memberCount"></span></h3>
    <div class="member-list" id="memberList"></div>
    <button class="add-member" onclick="openMemberModal()">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      添加家人
    </button>
  </aside>

  <main>
    <div id="emptyState" style="display:none" class="profile-card">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <div>还没有添加家人，点左上角「添加家人」开始记录</div>
      </div>
    </div>

    <div id="profileDetail" class="profile-card">
      <div class="profile-header">
        <div class="profile-avatar" id="pAvatar"></div>
        <div>
          <div class="profile-name" id="pName"></div>
          <div class="profile-sub" id="pSub"></div>
        </div>
        <button class="btn btn-outline profile-edit" onclick="openMemberModal(true)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          编辑
        </button>
      </div>

      <!-- 基本情况 -->
      <div class="section">
        <div class="section-head">
          <div class="section-title">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            基本情况
          </div>
        </div>
        <div class="info-grid" id="basicGrid"></div>
      </div>

      <!-- 健康问题 -->
      <div class="section">
        <div class="section-head">
          <div class="section-title">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>
            健康问题
          </div>
        </div>
        <div id="problemsList" class="problems-list"></div>
        <button class="add-problem" onclick="openProblemModal()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          添加健康问题
        </button>
      </div>

      <!-- 病史总览 -->
      <div class="section" id="historySection">
        <div class="section-head">
          <div class="section-title">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
            病史总览
          </div>
        </div>
        <div id="historyContent"></div>
      </div>
    </div>
  </main>
</div>

<!-- 编辑弹窗 -->
<div class="modal-mask" id="editModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">添加家人</div>
      <button class="modal-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label>称呼 <span class="req">*</span></label><input class="form-control" id="f_name" placeholder="如：爸爸、妈妈、爷爷"></div>
        <div class="form-group"><label>性别</label><select class="form-control" id="f_gender"><option>男</option><option>女</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>出生日期</label><input type="date" class="form-control" id="f_birth"></div>
        <div class="form-group"><label>血型</label><select class="form-control" id="f_blood"><option value="">未知</option><option>A型</option><option>B型</option><option>AB型</option><option>O型</option></select></div>
      </div>

      <div style="font-size:13px;font-weight:600;color:var(--ink);margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line)">病史总览</div>

<script>
const COLORS=['#0d9488','#3b82f6','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316'];
let state={members:[],currentId:null,editingId:null,saving:false,saveTimer:null};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function cur(){return state.members.find(m=>m.id===state.currentId)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function age(birth){if(!birth)return'';const b=new Date(birth),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a>=0?a:''}

let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2000)}
function setSyncStatus(text,color){const s=document.getElementById('syncStatus');if(s){s.textContent=text;s.style.color=color||'var(--ink3)'}}

const GH={owner:'ACE-glitch-del',repo:'asset-manager',path:'family-health-data.json',get token(){return localStorage.getItem('gh_token')||''}};
let fileSha=null;

async function ghLoad(){
  const res=await fetch('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/contents/'+GH.path,{headers:{'Authorization':'token '+GH.token,'User-Agent':'family-health'}});
  if(res.status===404)return null;
  if(!res.ok)throw new Error('GitHub '+res.status);
  const j=await res.json();
  fileSha=j.sha;
  return JSON.parse(decodeURIComponent(escape(atob(j.content))));
}

async function ghSave(data){
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
  const res=await fetch('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/contents/'+GH.path,{
    method:'PUT',
    headers:{'Authorization':'token '+GH.token,'Content-Type':'application/json','User-Agent':'family-health'},
    body:JSON.stringify({message:'更新家庭健康档案 '+new Date().toISOString(),content,sha:fileSha||undefined,branch:'main'})
  });
  if(!res.ok)throw new Error('GitHub '+res.status);
  const j=await res.json();
  fileSha=j.content.sha;
  return true;
}

function openTokenModal(){
  document.getElementById('tokenInput').value=GH.token;
  document.getElementById('tokenModal').classList.add('show');
}
function closeTokenModal(){document.getElementById('tokenModal').classList.remove('show')}
function saveToken(){
  const t=document.getElementById('tokenInput').value.trim();
  if(!t){toast('请输入Token');return}
  localStorage.setItem('gh_token',t);
  closeTokenModal();
  toast('Token已保存');
  loadData();
}
document.getElementById('tokenModal').addEventListener('click',e=>{if(e.target.id==='tokenModal')closeTokenModal()});

async function loadData(){
  if(!GH.token){
    setSyncStatus('未设置Token','#ef4444');
    toast('请先点右上角「设置」填写GitHub Token');
    initDefaultMembers();
    renderList();renderDetail();
    return;
  }
  setSyncStatus('加载中...');
  try{
    const data=await ghLoad();
    if(data&&data.members){
      state.members=data.members;
    }else{
      initDefaultMembers();
      await ghSave({members:state.members});
    }
    if(state.members.length&&(!state.currentId||!state.members.find(m=>m.id===state.currentId)))state.currentId=state.members[0].id;
    setSyncStatus('已同步','#22c55e');
  }catch(e){
    console.error('加载失败',e);
    setSyncStatus('离线模式','#f59e0b');
    if(state.members.length===0)initDefaultMembers();
    if(state.members.length&&!state.currentId)state.currentId=state.members[0].id;
    toast('无法连接GitHub，使用本地数据');
  }
  renderList();renderDetail();
}

async function saveData(immediate){
  if(state.saving&&immediate)return;
  clearTimeout(state.saveTimer);
  const doSave=async()=>{
    state.saving=true;
    setSyncStatus('同步中...','#f59e0b');
    try{
      await ghSave({members:state.members});
      setSyncStatus('已同步 '+new Date().toLocaleTimeString(),'#22c55e');
    }catch(e){
      console.error('保存失败',e);
      setSyncStatus('同步失败','#ef4444');
      toast('保存失败，请检查网络');
    }
    state.saving=false;
  };
  if(immediate)await doSave();
  else state.saveTimer=setTimeout(doSave,500);
}

function initDefaultMembers(){

    {id:uid(),name:'罗宇阳',gender:'男',birth:'1996-04-11',bloodType:'',color:'#0d9488',problems:[{id:uid(),title:'脾胃不好',desc:'最近很容易饱，喝酒醉了也很难恢复，肚子胀胀的，睡都睡不着，我自己都怀疑肠胃或者肝有问题。脾胃有问题就很麻烦，第二天大脑完全没有状态',principle:'忌生冷油腻，饮食七分饱；少喝酒，饭后散步',updates:[{id:uid(),date:'2026-09-14 10:00',content:'八段锦调理脾胃需单举，先学习一下要领'},{id:uid(),date:'2026-09-14 12:30',content:'学到了，就是抡着胳膊转圈，手举到头顶伸直。'}],date:'2026-09-14 12:30'},{id:uid(),title:'肾阴虚严重',desc:'',principle:'避免大汗运动，大汗伤津液；早睡养阴，忌熬夜；少吃辛辣',updates:[{id:uid(),date:'2026-09-14 11:00',content:'找了一下，还是八段锦双手攀足固腰肾最对症下药'}],date:'2026-09-14 11:00'}],history:''},
    {id:uid(),name:'陈倩仪',gender:'女',birth:'2000-09-14',bloodType:'',color:'#8b5cf6',problems:[],history:''},
    {id:uid(),name:'罗海华',gender:'男',birth:'1968-10-07',bloodType:'',color:'#3b82f6',problems:[{id:uid(),title:'右眼脉络膜恶性黑色素瘤肝转移',desc:'TxN0M1b IV期。2022年4月确诊，2024年7月肝转移。目前在中山大学肿瘤防治中心接受多模式综合治疗，病情相对稳定。',date:'2026-04'},{id:uid(),title:'长期用药',desc:'仑伐替尼（靶向）、特瑞普利单抗（免疫）、白蛋白紫杉醇（化疗）、优甲乐、氢化可的松',date:'2026-04'},{id:uid(),title:'血脂异常',desc:'血脂偏高，饮食控制中',date:'2026-04'},{id:uid(),title:'甲状腺功能异常',desc:'服优甲乐替代治疗',date:'2026-04'},{id:uid(),title:'复查要求',desc:'每周复查血常规、肝肾功能，定期CT/MRI，监测血压及蛋白尿',date:'2026-04'}],history:'2022年4月 | 中山大学肿瘤防治中心 | 确诊右眼脉络膜恶性黑色素瘤，行右眼同位素敷贴术\n2024年7月 | 中山大学肿瘤防治中心 | 复查发现肝转移（TxN0M1b IV期）\n2024年11月 | 中山大学肿瘤防治中心 | 行左肝外叶及S5/S6段切除术+射频消融术\n2025年9月 | 中山大学肿瘤防治中心 | 行肝肿瘤冷冻消融术\n2026年1月 | 中山大学肿瘤防治中心 | 第6次双路治疗，肝动脉造影+灌注术+栓塞术\n2026年4月 | 中山大学肿瘤防治中心 | 最新：行肝肿物冷冻消融术+第9次双路治疗；目前仑伐替尼靶向+特瑞普利单抗免疫+白蛋白紫杉醇化疗中'},
    {id:uid(),name:'张伟霞',gender:'女',birth:'1973-09-10',bloodType:'',color:'#ec4899',problems:[],history:''},
    {id:uid(),name:'罗沛桥',gender:'男',birth:'1940-01-01',bloodType:'',color:'#f97316',problems:[{id:uid(),title:'慢性阻塞性肺病',desc:'2026年5月因支气管肺炎住院确诊',date:'2026-05'},{id:uid(),title:'2型糖尿病',desc:'伴周围神经病变及肾病等并发症',date:'2026-05'},{id:uid(),title:'高血压病2级',desc:'极高危',date:'2026-05'}],history:'2026年5月 | 四会市人民医院 | 因支气管肺炎住院，确诊：慢性阻塞性肺病、2型糖尿病伴周围神经病变及肾病等并发症、高血压病2级极高危'},
    {id:uid(),name:'莫秋妹',gender:'女',birth:'1943-11-01',bloodType:'',color:'#f59e0b',problems:[{id:uid(),title:'心律失常',desc:'偶发房早（成对出现）、短阵房速、偶发室早',date:'2024-05'},{id:uid(),title:'心脏起搏器植入术后',desc:'2024年植入，电池寿命约10年，需定期复查起搏器功能',date:'2024'}],history:'2024年5月 | 肇庆市中心人民医院 | 动态心电图提示：窦性心律，偶发房早（成对出现）、短阵房速，偶发室早\n2024年 |  | 植入心脏起搏器，电池寿命约10年，需定期复查起搏器功能'}
  ];
  state.currentId=state.members[0].id;
}

function openModal(){document.getElementById('editModal').classList.add('show')}
function closeModal(){document.getElementById('editModal').classList.remove('show')}
document.getElementById('editModal').addEventListener('click',e=>{if(e.target.id==='editModal')closeModal()});

function renderList(){
  document.getElementById('memberCount').textContent=state.members.length+' 人';
  document.getElementById('memberList').innerHTML=state.members.map(m=>{
    const a=age(m.birth);
    return '<div class="member-item '+(m.id===state.currentId?'active':'')+'" onclick="selectMember(\''+m.id+'\')"><div class="member-avatar" style="background:'+m.color+'">'+esc(m.name.charAt(0))+'</div><div class="member-info"><div class="member-name">'+esc(m.name)+'</div><div class="member-meta">'+(m.gender||'')+(a?' · '+a+'岁':'')+'</div></div><button class="member-del" onclick="event.stopPropagation();delMember(\''+m.id+'\')" title="删除"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div>';
  }).join('');
}

function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('sidebarOverlay');
  sb.classList.toggle('open');
  ov.classList.toggle('show');
}
function selectMember(id){state.currentId=id;renderList();renderDetail();
  if(window.innerWidth<=760){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('show')}
}

function renderDetail(){
  const m=cur();
  const empty=document.getElementById('emptyState'),detail=document.getElementById('profileDetail');
  if(!m){empty.style.display='';detail.style.display='none';return}
  empty.style.display='none';detail.style.display='';
  document.getElementById('pAvatar').style.background=m.color;
  document.getElementById('pAvatar').textContent=m.name.charAt(0);
  document.getElementById('pName').textContent=m.name;
  const a=age(m.birth);
  document.getElementById('pSub').textContent=[m.gender,a?a+' 岁':'',m.bloodType].filter(Boolean).join(' · ');
  document.getElementById('basicGrid').innerHTML=[{label:'年龄',val:a?a+' 岁':''},{label:'性别',val:m.gender},{label:'出生日期',val:m.birth},{label:'血型',val:m.bloodType}].map(b=>'<div class="info-item"><label>'+b.label+'</label><div class="val '+(b.val?'':'empty')+'">'+(b.val?esc(b.val):'未填')+'</div></div>').join('');
  // 健康问题卡片
  const problems=Array.isArray(m.problems)?m.problems:[];
  document.getElementById('problemsList').innerHTML=problems.length?problems.map(p=>{
    const desc=p.desc||p.content||'';
    // 取最新的一条更新
    let latestUpdate='';
    let latestUpdateDate='';
    if(Array.isArray(p.updates)&&p.updates.length){
      const sorted=[...p.updates].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
      latestUpdate=sorted[0].content||'';
      latestUpdateDate=sorted[0].date||'';
    }else if(p.update){
      latestUpdate=p.update;
      latestUpdateDate=p.date||'';
    }
    const showDate=latestUpdateDate||p.date||'';
    return '<div class="problem-card" onclick="editProblem(\''+p.id+'\')"><div class="problem-card-head"><div class="problem-title">'+esc(p.title||'')+'</div><div class="problem-actions"><button class="problem-action-btn del" onclick="event.stopPropagation();delProblem(\''+p.id+'\')" title="删除"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div></div>'+(desc?'<div class="problem-content">'+esc(desc)+'</div>':'')+(p.principle?'<div class="problem-principle">'+esc(p.principle)+'</div>':'')+(latestUpdate?'<div class="problem-update"><span class="update-label">最新跟踪</span>'+(latestUpdateDate?latestUpdateDate+'：':'')+esc(latestUpdate)+'</div>':'')+(showDate?'<div class="problem-date"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>更新于 '+esc(showDate)+'</div>':'')+'</div>';
  }).join(''):'<div style="color:var(--ink3);font-size:13px;padding:8px 0;font-style:italic">暂无健康问题，点下方按钮添加</div>';
  // 病史总览
  const histSection=document.getElementById('historySection');
  const histContent=document.getElementById('historyContent');
  if(m.history&&m.history.trim()){
    histSection.style.display='';
    const lines=m.history.split('\n').filter(l=>l.trim());
    histContent.innerHTML='<div class="history-timeline">'+lines.map(line=>{
      const parts=line.split('|').map(p=>p.trim());
      const date=parts[0]||'';
      const place=parts[1]||'';
      const event=parts[2]||parts[1]||'';
      return '<div class="history-item"><div><span class="history-date">'+esc(date)+'</span>'+(place&&parts.length>=3?'<span class="history-place">'+esc(place)+'</span>':'')+'</div>'+(event?'<div class="history-event">'+esc(event)+'</div>':'')+'</div>';
    }).join('')+'</div>';
  }else{
    histSection.style.display='none';
  }
}

function openMemberModal(edit){
  state.editingId=edit?state.currentId:null;
  document.getElementById('modalTitle').textContent=edit?'编辑 '+cur().name:'添加家人';
  if(edit){
    const m=cur();
    document.getElementById('f_name').value=m.name||'';
    document.getElementById('f_gender').value=m.gender||'男';
    document.getElementById('f_birth').value=m.birth||'';
    document.getElementById('f_blood').value=m.bloodType||'';
    document.getElementById('f_history').value=m.history||'';
  }else{
    ['f_name','f_birth','f_blood','f_history'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('f_gender').value='男';
  }
  openModal();
}

function saveMember(){
  const name=document.getElementById('f_name').value.trim();
  if(!name){toast('请填写称呼');return}
  const data={name,gender:document.getElementById('f_gender').value,birth:document.getElementById('f_birth').value,bloodType:document.getElementById('f_blood').value,history:document.getElementById('f_history').value.trim()};
  if(state.editingId){const i=state.members.findIndex(m=>m.id===state.editingId);if(i>=0)state.members[i]={...state.members[i],...data}}
  else{const nm={id:uid(),color:COLORS[state.members.length%COLORS.length],...data};state.members.push(nm);state.currentId=nm.id}
  saveData();renderList();renderDetail();closeModal();toast('已保存');
}

// 健康问题卡片
let editingProblemId=null;
let updateRowCount=0;
function nowStr(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function renderUpdates(updates){
  const list=document.getElementById('updatesList');
  if(!updates||!updates.length){
    list.innerHTML='<div class="update-empty">暂无跟踪记录，点上方「+ 添加更新」</div>';
    return;
  }
  // 按日期倒序，最新的在上面
  const sorted=[...updates].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  list.innerHTML=sorted.map((u,i)=>{
    const rid='u_'+(updateRowCount++);
    return '<div class="update-row" data-rid="'+rid+'" data-date="'+(u.date||'')+'"><div class="update-date">'+(u.date||'')+'</div><textarea class="form-control u-content" placeholder="这次跟踪了什么、有什么变化">'+esc(u.content||'')+'</textarea><button type="button" class="del-update" onclick="this.parentElement.remove()" title="删除"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>';
  }).join('');
}
function addUpdateRow(){
  const list=document.getElementById('updatesList');
  const empty=list.querySelector('.update-empty');
  if(empty)empty.remove();
  const rid='u_'+(updateRowCount++);
  const now=nowStr();
  const row=document.createElement('div');
  row.className='update-row';
  row.dataset.rid=rid;
  row.dataset.date=now;
  row.innerHTML='<div class="update-date">'+now+'</div><textarea class="form-control u-content" placeholder="这次跟踪了什么、有什么变化"></textarea><button type="button" class="del-update" onclick="this.parentElement.remove()" title="删除"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
  list.appendChild(row);
}
function openProblemModal(id){
  editingProblemId=id||null;
  const m=cur();
  document.getElementById('problemModalTitle').textContent=id?'编辑健康问题':'添加健康问题';
  if(id&&m&&Array.isArray(m.problems)){
    const p=m.problems.find(x=>x.id===id);
    if(p){
      document.getElementById('pf_title').value=p.title||'';
      document.getElementById('pf_desc').value=p.desc||p.content||'';
      document.getElementById('pf_principle').value=p.principle||'';
      // 兼容旧数据：如果有update字符串，转成一条更新
      let updates=p.updates||[];
      if(!updates.length&&p.update)updates=[{date:p.date||'',content:p.update}];
      renderUpdates(updates);
    }
  }else{
    document.getElementById('pf_title').value='';
    document.getElementById('pf_desc').value='';
    document.getElementById('pf_principle').value='';
    renderUpdates([]);
  }
  document.getElementById('problemModal').classList.add('show');
}
function closeProblemModal(){document.getElementById('problemModal').classList.remove('show')}
document.getElementById('problemModal').addEventListener('click',e=>{if(e.target.id==='problemModal')closeProblemModal()});
function saveProblem(){
  const title=document.getElementById('pf_title').value.trim();
  if(!title){toast('请填写问题');return}
  const desc=document.getElementById('pf_desc').value.trim();
  const principle=document.getElementById('pf_principle').value.trim();
  // 收集所有更新行
  const updates=[];
  document.querySelectorAll('#updatesList .update-row').forEach(row=>{
    const date=row.dataset.date||'';
    const content=row.querySelector('.u-content').value.trim();
    if(content)updates.push({id:uid(),date,content});
  });
  // 按日期排序，最新的在前面
  updates.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const m=cur();
  if(!m)return;
  if(!Array.isArray(m.problems))m.problems=[];
  const today=new Date().toISOString().slice(0,10);
  const latestDate=updates.length?updates[0].date:today;
  if(editingProblemId){
    const i=m.problems.findIndex(p=>p.id===editingProblemId);
    if(i>=0)m.problems[i]={...m.problems[i],title,desc,principle,updates,date:latestDate};
  }else{
    m.problems.push({id:uid(),title,desc,principle,updates,date:latestDate});
  }
  saveData();renderDetail();closeProblemModal();toast('已保存');
}
function editProblem(id){openProblemModal(id)}
function delProblem(id){
  const m=cur();
  if(!m||!Array.isArray(m.problems))return;
  if(!confirm('确定删除这个健康问题？'))return;
  m.problems=m.problems.filter(p=>p.id!==id);
  saveData();renderDetail();toast('已删除');
}

function delMember(id){
  const m=state.members.find(x=>x.id===id);if(!m)return;
  if(!confirm('确定删除「'+m.name+'」的档案？'))return;
  state.members=state.members.filter(x=>x.id!==id);
  if(state.currentId===id)state.currentId=state.members[0]?.id||null;
  saveData();renderList();renderDetail();toast('已删除');
}

loadData();
</script>
